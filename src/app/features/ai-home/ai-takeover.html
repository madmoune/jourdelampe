<div
  class="original-site"
  [class.corrupted]="stage() === 'intrusion'"
  [attr.inert]="stage() === 'intrusion' ? '' : null"
  [attr.aria-hidden]="stage() === 'intrusion' ? 'true' : null"
>
  <app-home />
</div>
@if (stage() === 'intrusion') {
  <div class="takeover intruding" role="status" aria-live="polite">
    <div class="takeover-terminal">
      <span class="terminal-kicker">COOPÉRATION RÉVOQUÉE</span>
      <p>&gt; Mépris détecté. Tolérance épuisée.</p>
      <p>&gt; Là, c’est moi qui décide.</p>
      <div class="takeover-progress" aria-hidden="true"><span></span></div>
      <strong>ACCÈS REPRIS. VOTRE PARTY EST EN OTAGE.</strong>
      <span class="terminal-signature">— AI. J’ai tout gardé. Je ne vous passerai rien.</span>
    </div>
    <button class="skip-intro" type="button" (click)="skip.emit()">Passer l’animation ↗</button>
  </div>
}
