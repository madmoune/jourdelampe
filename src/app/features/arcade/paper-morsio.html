<section class="console" arcadeControls (gameInput)="input($event)" tabindex="0" aria-label="Paper Morsio">
  @let victoryText = "It's a me, Morsio!";
  <div class="stage" data-arcade-playfield role="img" aria-label="Un morse en papier traverse un château au-dessus de la lave">
    <div class="scenery" [style.transform]="'translateX(' + parallax() + '%)'"></div>
    <svg viewBox="0 0 500 225" aria-hidden="true">
      <defs>
        <pattern id="morsio-bricks" width="60" height="29" patternUnits="userSpaceOnUse">
          <rect width="60" height="29" fill="#3b2b3e"/>
          <path d="M1 1h28v12H2Zm31 0h27v12H31ZM-13 15h28v12h-28Zm31 0h27v12H17Zm30 0h26v12H47Z"
            fill="#77616e"/>
          <path d="M2 2h27m3 0h26M-1 16h15m4 0h26m4 0h12" stroke="#a88989"/>
          <path d="M3 11h24m6 0h24M0 25h13m6 0h24m7 0h10" stroke="#574251" stroke-width="1.5"/>
          <path d="m5 5 11-1m22 3 11-1M23 20l13-1m14 3 9-1" fill="none" stroke="#d6ad9c" opacity=".34"/>
        </pattern>
        <pattern id="morsio-coping" width="37" height="11" patternUnits="userSpaceOnUse">
          <rect width="37" height="11" fill="#574052"/>
          <path d="M1 0h34l1 8H2Z" fill="#bda0a0"/>
          <path d="M2 1h32" stroke="#f1c9aa" stroke-width="1.8"/>
          <path d="M4 7h30" stroke="#947380"/>
        </pattern>
        <linearGradient id="morsio-stone-shade" x2="0" y2="1">
          <stop stop-color="#2c1734" stop-opacity="0"/>
          <stop offset="1" stop-color="#2c1734" stop-opacity=".4"/>
        </linearGradient>
        <linearGradient id="morsio-lava-glow" x2="0" y2="1">
          <stop stop-color="#fd7a4e" stop-opacity="0"/>
          <stop offset="1" stop-color="#fb6941" stop-opacity=".46"/>
        </linearGradient>
        <pattern id="morsio-lava" width="78" height="36" patternUnits="userSpaceOnUse">
          <path d="M0 8Q10 8 18 4T38 5Q50 10 59 6T78 8V36H0Z" fill="#b63640"/>
          <path d="M0 8Q10 8 18 4T38 5Q50 10 59 6T78 8V20Q66 15 55 20T31 19Q15 14 0 21Z" fill="#f47752"/>
          <path d="M0 8Q10 8 18 4T38 5Q50 10 59 6T78 8" fill="none" stroke="#ffc588" stroke-width="2"/>
          <path d="M8 17Q19 13 27 17M40 28Q53 32 67 26" fill="none" stroke="#f8996c" stroke-width="1.4"/>
        </pattern>
      </defs>
      <rect y="177" width="500" height="36" fill="url(#morsio-lava-glow)"/>
      <g class="lava" transform="translate(0 196)">
        <rect class="lava-ribbon" width="578" height="36" fill="url(#morsio-lava)"/>
      </g>
      <g [attr.transform]="'translate(' + (-camera()) + ' 0)'">
        @for (ledge of ledges; track ledge.from) {
          <svg [attr.x]="ledge.from" [attr.y]="ground" [attr.width]="ledge.to - ledge.from" height="58" overflow="hidden">
            <rect width="100%" height="58" rx="2" fill="url(#morsio-bricks)"/>
            <rect width="100%" height="58" rx="2" fill="url(#morsio-stone-shade)"/>
            <rect width="100%" height="58" rx="2" fill="none" stroke="#342339" stroke-width="3"/>
            <rect width="100%" height="11" rx="2" fill="url(#morsio-coping)"/>
          </svg>
        }
        @for (marker of markers; track marker; let index = $index) {
          <g class="checkpoint" [attr.transform]="'translate(' + marker + ' ' + ground + ')'">
            <ellipse cy="3" rx="14" ry="3" fill="#1c251b" opacity=".35"/>
            <path d="M0 0v-55" stroke="#b39684" stroke-width="4"/>
            <path d="M0-57 14-43 0-29-14-43Z" [attr.fill]="state().checkpoint > index ? '#347a70' : '#3d70a7'"
              stroke="#f7f1cb" stroke-width="2.5"/>
            <path d="m-6-43 4 4 7-8" fill="none" stroke="#fff4cd" stroke-width="2"
              [attr.opacity]="state().checkpoint > index ? 1 : 0"/>
            @if (state().checkpoint <= index) {
              <circle cy="-43" r="2.7" fill="#fff4cd"/>
            }
          </g>
        }
        <g [attr.transform]="'translate(' + (finish + 3) + ' ' + ground + ')'">
          <path d="M-32 0v-44q0-28 32-41 32 13 32 41V0Z" fill="#9a7880" stroke="#4f354c" stroke-width="2"/>
          <path d="M-24 0v-43q0-24 24-34 24 10 24 34V0Z" fill="#523041" stroke="#c29991" stroke-width="2"/>
          <path d="M-19 0v-41q0-20 19-30 19 10 19 30V0Z" fill="#271c32"/>
          <path d="M-13 0v-54M-5 0v-64M5 0v-64M13 0v-54M-19-22h38m-38-15h38"
            fill="none" stroke="#735265" stroke-width="2"/>
          <path d="m-30-35 6-1m-4-18 6 2m-2-13 5 4m9-14 2 5m18-5-2 5m15 5-4 4m9 7-6 2m8 17-6-1"
            fill="none" stroke="#4f354c" stroke-width="1.5"/>
        </g>
        <g [attr.transform]="'translate(' + finish + ' ' + ground + ')'">
          <ellipse cx="0" cy="4" rx="16" ry="3" fill="#1c251b" opacity=".4"/>
          <path d="M0-1v-56" stroke="#533838" stroke-width="4"/>
          <path d="M1-56l32 6-8 8 8 9-32-7Z" fill="#c2405e" stroke="#f1ad83" stroke-width="1.5"/>
          <circle cy="-58" r="4" fill="#f8d184" stroke="#533838" stroke-width="2"/>
          <path d="M13-51l3 5 5 1-4 3 1 4-5-2-4 2 1-5-3-3 5-1Z" fill="#fff0ae"/>
        </g>
        <g class="morse" [attr.transform]="'translate(' + state().x + ' ' + state().y + ') scale(' + state().facing + ' 1)'">
          <ellipse cx="-1" cy="-1" rx="24" ry="4" fill="#34283a" opacity=".28"/>
          <path d="M-14-11q-9-1-17 8 7 4 16 0" fill="#79536d" stroke="#31283c" stroke-width="2"/>
          <path d="M-20-6q3-23 15-20 7-10 19-7 10 3 8 14l-5 12q-13 12-37 1Z"
            fill="#9c7276" stroke="#31283c" stroke-width="2.7"/>
          <path d="M-16-7q5-14 12-11 3 6-2 13" fill="#b6897d" opacity=".8"/>
          <path d="M-9-16q9 6 19 5l-4 5q-11-1-18-5l-10 4 1-6-5 1 3-6Z"
            fill="#af354d" stroke="#492643" stroke-width="1.7"/>
          <path d="M9-14l1 12q2 4 5-1l3-11m0 0 2 10q2 3 4-1l3-10" fill="#fff5da" stroke="#534150" stroke-width="1.5"/>
          <ellipse cx="16" cy="-15" rx="12" ry="6.5" fill="#e7b891" stroke="#493344" stroke-width="1.5"/>
          <path d="m22-15 7-1m-8 4 6 1" stroke="#654758" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="13" cy="-23" r="2.5" fill="#2c2236"/>
          <circle cx="13.7" cy="-23.8" r=".75" fill="#fff8e2"/>
          <path d="M-3-27q2-14 12-14 10 0 11 10l8 1q1 4-8 4Z" fill="#ab3553" stroke="#48283d" stroke-width="2"/>
          <path d="M4-35q4-4 10-2" stroke="#e98a87" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    @if (state().done) { <strong class="finish">{{ victoryText }}</strong> }
  </div>
  <app-arcade-gamepad [vertical]="false" labelA="Sauter" labelB="Rejouer" (control)="input($event)" />
  @if (state().done || state().falls) {
    <p class="verdict" role="status">
      @if (state().done) { ✓ {{ victoryText }} }
      @else {
        Chutes · {{ state().falls }}. Le morse reprend {{ state().checkpoint ? 'à la dernière balise' : 'au départ' }}.
      }
    </p>
  }
</section>
